name: Fix video asset path

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-video-path:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update video filename
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'assets/video/hope-story.mp4'
          new = 'assets/video/hope-video.mp4'
          if old in text:
              p.write_text(text.replace(old, new), encoding='utf-8')
              print('Updated video path.')
          else:
              print('Old video path not found; no change needed.')
          PY

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-video-path.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix video asset path"
          git push